  <source src="/Videoer/DearAlice.mp4" type="video/mp4">

<div class="content">
    <h1>Velkommen til Andrhska!</h1>
    <p id="info">Her finner du Kok, Yatzy, Memes, CGP sanger, V&aelig;rmelding, Busstider, HC-arrangementer, Sudoku, Kortspill, og sikkert et par andre ting</p>
    <!-- Use a button to pause/play the video with JavaScript -->
    <button id="myBtn" class="button1" onclick="pauseBackground()">Pause</button>
    <button id="KontorTavle" class="button1"  onclick="window.location.href='/Vearmelding/index.html'">KontorTavle</button>
    <button id="Yatzy" class="button1" onclick="window.location.href='/Spill/Fri-Yatzy/index.html'">Yatzy</button>
    <button id="CGP" class="button1" onclick="window.location.href='/CGP/index.html'">CGP</button>
    <button id="Kok" class="button1"   onclick="ChangeBackground()">Kok</button>
    <button id="Memes" class="button1"   onclick="ChangeBackground()">Memes</button>
    <button id="MorePages" class="button1 "  onclick="carusell()">Flere Sider</button>
    <button id="myBtn" class="button1" onclick="OriginalBackground()">Alice</button>

</div>

<script>
    const myVideo = document.getElementById("myVideo");
    const myBtn = document.getElementById("myBtn");
    const carusell3d = document.getElementById("3d-image-carousel");
    const source = myVideo.querySelector("source");


    function pauseBackground() {
        //carusell3d.style.visibility = "hidden"; //extra precaution
        document.body.style.backgroundImage = '';

        if (myVideo.paused) {
            myVideo.play();
            myBtn.innerHTML = "Pause";
        } else {
            myVideo.pause();
            myBtn.innerHTML = "Avspill";
        }
    }

    function OriginalBackground() {
        if (myVideo.paused) {
            changeVideo("/Videoer/DearAlice.mp4");
            myVideo.play();
            carusell3d.style.visibility = "hidden";
            myVideo.style.visibility = "visible";
            myBtn.innerHTML = "Pause";
        } else {
            myVideo.pause();
            myBtn.innerHTML = "Avspill";
        }
    }

  function ChangeBackground() {
    carusell3d.style.visibility = "hidden";
    myVideo.style.visibility = "hidden";
    myBtn.innerHTML = "Avspill";
    // Replace this with your actual image path
    //Change the <p id="info"> also
    document.body.style.backgroundImage = 'url("/Bilder/jurassic-park-ah.gif")';
    document.body.style.backgroundSize = "contain"; //cover
    document.body.style.backgroundPosition = "center";
  }
  function carusell() {
    changeVideo("/Videoer/BeeCollision.mp4");
    carusell3d.style.visibility = "visible";
  }
    function changeVideo(videoPath) {
        document.body.style.backgroundImage = '';
        myVideo.style.visibility = "visible";
        myBtn.innerHTML = "Pause";

        const video = document.getElementById("myVideo");
        video.src = videoPath;
        video.load();
        video.play();
    }

</script>
