<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Oxygen" rel="stylesheet" type="text/css">
    <link href="../../../CSS/style.css" rel="stylesheet"/>
    <title>2. Semester</title>
    <!-- Takk til https://williada.folk.ntnu.no for koden!!!-->
    <style>
        /* Add CSS styles for your buttons here */
        ul {
            list-style-type: none;
            padding: 0;
        }
    
        button {
            width: 200px;
            display: block;
            margin: 10px 0;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            text-decoration: none;
            background-color: rgb(77, 145, 168);
            color: #ffffff;   /* Change the text color */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;  /*Change the background color on hover */
        }


        li {
            width: 200px;
            display: block;
            margin: 10px 0;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            text-decoration: none;
            background-color: rgb(77, 145, 168);
            color: #ffffff;   /* Change the text color */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        li:hover {
            background-color: #0056b3;  /*Change the background color on hover */
        }

        .folder {
            cursor: pointer;
            font-weight: bold;
        }

        .file {
            cursor: pointer;
        }

        iframe {
            width: 80%;
            height: 800px; /* Adjust the height as needed */
            border: none;
        }
        body {
            background-color: lightcyan; /* Change the background color */
            font-family: 'Oxygen', sans-serif; /* Use the Oxygen font */
        }
    </style>
</head>

<!-- Google tag (gtag.js) -->

<body>
    <h1>2. Semester</h1>
    <h2>Jeg beklager for d&aring;rlig funksjonalitet, jeg jobber med saken. Jeg beklager også for at noen STACK linker til feil STACK (statistikk)</h2>

    <div style = "display: flex; flex-direction: row;margin: 20px">
        <div style ="display: flex;flex-direction: column;">
            <form action="../">
                <button type="submit" class="button" style="vertical-align:middle">Tilbake</button>
            </form>

            <div style = "padding: 20px;">
                <ul id="pdf-list">
                    <!-- PDF file names will be displayed as buttons here -->
                </ul>
            </div>
        </div>

        <iframe id="pdf-viewer" src="" frameborder="0"></iframe>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const pdfList = document.getElementById('pdf-list');
            const pdfViewer = document.getElementById('pdf-viewer');

            // List of PDF file names
            const pdfFolders = [
                'Prosess',
                'Statistikk',
                "Uorganisk",
                // Add more file names as needed
            ];

            // Nested structure of folders and files
            const folderFiles = {
                'Prosess': {
                    'Øvinger': {
                        'Øving_11.pdf': null
                    },
                    'Prosjekt': {
                        'Prosessteknikk.pdf': null,
                        'Kodee': {
                            'constants8.txt': null,
                            'Enthalpybalance.txt': null,
                            'Massbalance.txt': null,
                            'p(CO2)_constant_a.txt': null,
                            'p(CO2)_constant_T.txt': null,
                            'README.txt': null
                        }
                    },
                    'Python_Øving_2': {
                        'Oppgave1.py': null,
                        'Oppgave2Kode.py': null,
                        'Oppgavebeskrivelse.pdf': null,
                        'PythonØving2.pdf': null
                    }
                },
                'Statistikk': {
                    'STACK9_oppg4.py': null,
                    'STACK_1.pdf': null,
                    'STACK_10.pdf': null,
                    'STACK_10_oppg2.py': null,
                    'STACK_10_Oppg3.py': null,
                    'STACK_11.pdf': null,
                    'STACK_11_oppg3g.py': null,
                    'STACK_12.pdf': null,
                    'STACK_1_python.py': null,
                    'STACK_2.pdf': null,
                    'STACK_3.pdf': null,
                    'STACK_4.pdf': null,
                    'STACK_5.pdf': null,
                    'STACK_6.pdf': null,
                    'STACK_7.pdf': null,
                    'STACK_8.pdf': null
                },
                'Uorganisk': {}
            };

            function isMobile() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            }

            // Function to load PDF into the iframe
            function loadPDF(pdfFileName) {
                if (isMobile()) {
                    // On mobile: open in new tab [men er kinda i samme side]
                    window.open(pdfFileName, '_blank');
                } else {
                    // On desktop: load in iframe
                    pdfViewer.src = pdfFileName;
                }
            }

            // Function to build the file tree
            function buildTree(obj, currentPath = '') {
                const ul = document.createElement('ul');
                for (const key in obj) {
                    const li = document.createElement('li');
                    const fullPath = currentPath ? `${currentPath}/${key}` : key;
                    if (typeof obj[key] === 'object' && obj[key] !== null) {
                        // folder
                        li.textContent = key;
                        li.classList.add('folder');
                        li.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const sub = li.querySelector('ul');
                            if (sub) sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
                        });
                        const subUl = buildTree(obj[key], fullPath);
                        subUl.style.display = 'none';
                        li.appendChild(subUl);
                    } else {
                        // file
                        li.textContent = key;
                        li.classList.add('file');
                        li.addEventListener('click', () => {
                            loadPDF(fullPath);
                        });
                    }
                    ul.appendChild(li);
                }
                return ul;
            }

            // Loop through the PDF files and create buttons
            pdfFolders.forEach(folderName => { //skal stå pdfFolder ...?
                if (folderName === 'Uorganisk') {
                    // Create a link for "Uorganisk"
                    const link = document.createElement('a');
                    const button = document.createElement('button');
                    button.textContent = 'Uorganisk';
                    button.addEventListener('click', () => {
                        window.open('https://mayate.folk.ntnu.no/Kok/Uorganisk/', '_blank');
                    });
                    pdfList.appendChild(button);
                    pdfList.appendChild(link);
                } else {
                    const button = document.createElement('button');
                    button.textContent = folderName;
                    button.addEventListener('click', () => {
                        loadFilesInFolder(folderName);
                    });
                    pdfList.appendChild(button);
                }
            });
            // Function to load files in the selected folder
            function loadFilesInFolder(folderName) {
                // Clear existing list
                pdfList.innerHTML = '';
                const obj = folderFiles[folderName] || {};
                const tree = buildTree(obj, folderName);
                pdfList.appendChild(tree);
            }
        });
    </script>
</body>
</html>
