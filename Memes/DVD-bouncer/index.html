<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Don't Move</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    .dvd-wrapper {
      position: absolute;
      width: 183px;
      height: 186px;
      z-index: 1;
      display: none; /* hidden initially */
    }

    .dvd-logo {
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: none;
      pointer-events: none;
      background-color: rgba(255, 255, 255, 0.5);
      mix-blend-mode: screen;
      z-index: 2;
    }
  </style>
</head>
<body>
    <audio id="myAudio">
        <source id="audioSource" src="/Audio/blindside-audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <!-- ALL PICTURES TO HAVE SAME SIZE (at least for now, makes this MUCH easier), the sizes are under .dvd-wrapper in style-->
    <div class="dvd-wrapper">
        <img class="dvd-logo" src="/Bilder/dvd_balls.gif" /> 
        <div class="overlay"></div>
    </div>
    <div class="dvd-wrapper">
        <img class="dvd-logo" src="/Bilder/markonini_jetvicini.png" />
        <div class="overlay"></div>
    </div>
    <div class="dvd-wrapper">
        <img class="dvd-logo" src="/Bilder/Skjermbilde 2025-01-29 172008.png" />
        <div class="overlay"></div>
    </div>

    <script>
        const imageWidth = 183; //********************All pictures to have this Width and Height
        const imageHeight = 186;
        let bouncers = [];
        let animationFrameId;
        let animationPaused = true;

        function rand255() {
        return Math.floor(Math.random() * 256);
        }

        function Meme_bouncer() {
        const wrappers = document.querySelectorAll('.dvd-wrapper');

        if (bouncers.length === 0) { // Makes each picture spawn in, the Math.Random places it randomly, and gives it a random speed
            wrappers.forEach(wrapper => {
            const logo = wrapper.querySelector('.dvd-logo');
            const overlay = wrapper.querySelector('.overlay');

            let x, y, dx, dy;
            let maxTries = 100;
            let tries = 0;
            let overlapping;

            do {
                x = Math.random() * (window.innerWidth - imageWidth);
                y = Math.random() * (window.innerHeight - imageHeight);
                dx = (Math.random() < 0.5 ? -1 : 1) * (1 + Math.random() * 1);
                dy = (Math.random() < 0.5 ? -1 : 1) * (1 + Math.random() * 1); //(1 + Math.random() * a) changie the value of a, to scale the speed

                overlapping = bouncers.some(b => //make sure they dont spawn insie eahcother
                !(x + imageWidth < b.x ||
                    x > b.x + imageWidth ||
                    y + imageHeight < b.y ||
                    y > b.y + imageHeight)
                );

                tries++;
            } while (overlapping && tries < maxTries);

            wrapper.style.left = x + 'px';
            wrapper.style.top = y + 'px';

            bouncers.push({ //these are the values of picture "b" that are pushed to display
                el: wrapper,
                img: logo,
                overlay: overlay,
                x,
                y,
                dx,
                dy,
                flashing: false 
            });
            });

            bouncers.forEach(b => {
            b.el.style.display = 'block'; //idk, maybe make sure they are squared shape? asked chat to translate a python-turtle.shape() code
            });

            animationPaused = false; //the "animation" is the pictures moving around
            update();
        }}

        function update() { //all this does is to calculate bounces really
        if (animationPaused) return;

        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        bouncers.forEach(b => {
            const prevDX = b.dx;
            const prevDY = b.dy;

            let hitCorner = false;
            b.flashing = false;

            if (b.x + b.dx > screenWidth - imageWidth || b.x + b.dx < 0) {
            b.dx *= -1;
            hitCorner = true;
            }
            if (b.y + b.dy > screenHeight - imageHeight || b.y + b.dy < 0) {
            b.dy *= -1;
            hitCorner = hitCorner && true;
            } else {
            hitCorner = false;
            }

            if (hitCorner && !b.flashing) { //ads a rainbow overlay if anything hits the corner of the screen 
                console.log("Something hit a SCREEN-corner! Rainbow time")
                b.flashing = true;
                b.overlay.style.display = 'block';
                let time = 0;
                const interval = setInterval(() => {
                    b.overlay.style.backgroundColor =
                    `rgba(${rand255()}, ${rand255()}, ${rand255()}, 0.9)`; //0.9 = opacity
                    time += 100;
                    if (time >= 5000) {
                        clearInterval(interval);
                        b.overlay.style.display = 'none';
                        b.flashing = false;
                    }
                }, 200); //This number is supposed to represent how often (in ms) it is to change color
                //but i believe it actually means hoe ovften is has a white overlay
            }

            b.x += b.dx;
            b.y += b.dy;
            b.el.style.left = b.x + 'px';
            b.el.style.top = b.y + 'px';
        });

        // Collision detection between pictures
        for (let i = 0; i < bouncers.length; i++) {
            for (let j = i + 1; j < bouncers.length; j++) {
            const a = bouncers[i];
            const b = bouncers[j];

            const overlapping = !(
                a.x + imageWidth < b.x ||
                a.x > b.x + imageWidth ||
                a.y + imageHeight < b.y ||
                a.y > b.y + imageHeight
            );

            if (overlapping) {
                const dx = (a.x + imageWidth / 2) - (b.x + imageWidth / 2); //in a way, a.dx is the speed of a in teh direction x, but dx is the distance between the centers of both pictures.
                const dy = (a.y + imageHeight / 2) - (b.y + imageHeight / 2);
                const offset = 10;

                if (Math.abs(dx) > Math.abs(dy) + offset) { //if they "overlap" more in x-axis than y-axis i assume that they hit eachothers side first, offset, because if the difference is close "Corner hit, line 203"
                if (Math.sign(a.dx) === Math.sign(b.dx)) { //if thay move in the same direction before collision in x
                    const temp = a.dx; //they bounce like billiard balls, the faster one has to be coming from behind, and here they switch speeds
                    a.dx = b.dx;
                    b.dx = temp;
                } else {
                    a.dx *= -1; //if they 
                    b.dx *= -1;
                }
                } else if (Math.abs(dy) > Math.abs(dx) + offset) {
                if (Math.sign(a.dy) === Math.sign(b.dy)) {
                    const temp = a.dy;
                    a.dy = b.dy;
                    b.dy = temp;
                } else {
                    a.dy *= -1;
                    b.dy *= -1;
                }
                } else { //if teh point of collision is closer than "offset" to the corners of both pictures, they change directions in the following way;
                    console.log("Corner hit")
                    a.dx *= -1;
                    b.dx *= -1;
                    a.dy *= -1;
                    b.dy *= -1;
                }
            }
            }
        }

        animationFrameId = requestAnimationFrame(update); //all of these "animation" thingies makes the pictures MOVE
        }

        function pauseAnimation() { 
            animationPaused = true; // line 119; runs animation
            cancelAnimationFrame(animationFrameId);
            bouncers.forEach(b => b.el.style.display = 'none');
        }

        function inactivityTime() {
            let timeout;
            function resetTimer() {
                clearTimeout(timeout);
                timeout = setTimeout(inactive, 2000); // if inactive for 2000 ms (2 s): do shit
                if (!animationPaused) pauseAnimation(); // Pause animation if active (starts when inactive)
            }

            function inactive() {
                console.log("User inactive: Resuming Meme_bouncer");
                bouncers = []; //reset variable needed for pictures to spawn in
                Meme_bouncer(); // Start animation when user becomes active again
                playAudio();
            }

            function userActive() {
                console.log("User active: Resuming Meme_bouncer");
                pauseAnimation();
                pauseAudio();
            }

            // Add event listeners for any user interaction
            ['mousemove', 'keydown', 'scroll', 'touchstart', 'click'].forEach(evt =>
                window.addEventListener(evt, resetTimer)
            );

            // Also trigger user activity to start the animation
            window.addEventListener('mousemove', userActive); // User is active on mouse move
            window.addEventListener('keydown', userActive);   // User is active on key press
            window.addEventListener('scroll', userActive);    // User is active on scroll
            window.addEventListener('touchstart', userActive);// User is active on touch
            resetTimer(); // Start the timer when the page loads
        }
         
        //Music stuff: (better to copy from Yatzy og Gameshow page)

        const audio = document.getElementById("myAudio");
        const audioSource = document.getElementById("audioSource");

        function playAudio() {
            if (audio.paused) {
                audio.play();
            }
        }

        function pauseAudio() {
            audio.pause();
        }

        // Når en sang er ferdig, start sangen på nytt
        audio.onended = function() {
            audio.play(); // Start sangen på nytt når den er ferdig
        };


        window.onload = function() {
            inactivityTime();
        };
    </script>
</body>
</html>
