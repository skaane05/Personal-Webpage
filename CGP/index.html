<!DOCTYPE html>
<html lang="en">
<head>
    <title>CGPs Beste </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.2/rollups/aes.js" integrity="sha256-/H4YS+7aYb9kJ5OKhFYPUjSJdrtV6AeyJOtTkw6X72o=" crossorigin="anonymous"></script> <!-- For CryptoJs-->
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PNJ5XKVFTR"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-PNJ5XKVFTR');
    </script>
    <style>
      .music-player {
        margin-top: 100px;
        bottom: 0;
        left: 25%;
        width: 100%;
        color: #f9cf00; 
    }
    .SangRad {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px;
        border-bottom: 1px solid #ccc;
    }

    .PlayThisSongButton {
        cursor: pointer;
        padding: 6px 12px;
    }
    .progress-container {
        width: 100%;
        max-width: 500px;
        margin: 10px 0;
    }

    .song-times {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #777;
        margin-bottom: 4px;
    }

    #progressBar {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 5px;
        border-radius: 5px;
        background: #d0d0d0;
        cursor: pointer;
        display: block;
        margin: 0;
    }
    
    .Songlist {
      margin-bottom: 50px;
    }

    </style>
</head>
<body>
  <div class="Songlist">
    <h1>Sangutvalg</h1>
    <p>Om du trykker på "spill" mens en sang spilles, kan koden bli kvelt. Bare trykk spill på nytt.</p>
    <p>Hint: Du kan dra slideren</p>
    <p>Noen Sanger starter med stillhet / litt tidlig - dette skal fikses</p>
    <div id="Sangutvalg"></div>
    <hr style="height: 3px; background-color: black;"> <!--En horisontal linje-->
  </div>
  <div class="music-player">
    <audio id="myAudio"> <!-- Add progressbar so user can skip/go bak-->
        <source id="audioSource" src="" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <div style="display: flex; gap: 20px; flex-direction: row;">
        <!--<button type="button" onclick="togglePlay()" aria-label="Spill eller pause musikk">
            <img src="/Bilder/PlayingSong.svg" alt="">
        </button>   
        <button type="button" onclick="nextSong()" aria-label="Spill eller pause musikk">
            <img src="/Bilder/SkipSong.svg" alt="">
        </button> 
      -->
        <img src="/Bilder/NoSound.svg" onclick="togglePlay()" id="toggleplayButton" style="width: 50px; height: 50px;" title="Spill/Pause musikk">
        <img src="/Bilder/SkipSong.svg" onclick="nextSong(); this.style.transform='translateX(10px)'; setTimeout(() => { this.style.transform=''; }, 300);" id="nextSong" style="width: 50px; height: 50px; transition: transform 0.5s;" title="Neste sang">
      </div>
  </div>
  <div class="progress-container">
    <div id="SongName">Ingen sang valgt</div>
    <div class="song-times">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <input
        type="range"
        id="progressBar"
        min="0"
        max="1000"
        value="0"
        step="1"
        aria-label="Sangposisjon"
    >
  </div>
   

    <script>
        let startTime = Date.now();
    </script>
    <script>
      /*LES HER --- Alt angående selve spillet yatzy, som reset-button er under script.js, google gtag om reset-button er under*/
      const audio = document.getElementById("myAudio");
      const audioSource = document.getElementById("audioSource");

      const playlist = [
          "/Audio/CGP_Sanger/3-klasse-CGP-2026.mp3",
          "/Audio/CGP_Sanger/AC-Style.mp3",
          "/Audio/CGP_Sanger/DALJEKÅT.mp3",
          "/Audio/CGP_Sanger/De-Gamle_En-gang-til_CGP2023.mp3",
          "/Audio/CGP_Sanger/Hebraisk_kokevise_CGP2023.mp3",
          "/Audio/CGP_Sanger/Laboratoddy_CGP2026.mp3",
          "/Audio/CGP_Sanger/Nanjing-House.mp3",
          "/Audio/CGP_Sanger/Operon-Glow.mp3",
          "/Audio/CGP_Sanger/Pølse i Lompe - Team KJEMPEGRILL.mp3",
          "/Audio/CGP_Sanger/Styret.mp3",
          ];
      const songNames = [
        "Woo-hoo - Klasse 28 (2026)",
        "AC Style - AC  (2026)",
        "DALJEKÅT - (2018)",
        "En gang til - De gamle (2023)",
        "Hebraisk Kokevise - Klasse 26 (2023)",
        "Laboratoddy (2026)",
        "Nanjing House - De gamle (2026)",
        "GFP - Operon (2026)",
        "Pølse i Lompe - Team KJEMPEGRILL (2025)",
        "MVA - Styret V26",
      ]

      function displaySongs(div_ID) {
            const utvalg = document.getElementById(div_ID);

            if (!utvalg) {
                console.error("Klarte ikke å hente sangutvalg");
                return;
            }

            // Kontroller at hver sang har en tilhørende lydfil
            if (playlist.length !== songNames.length) {
                console.error("Ulik lengde på playlist og songNames");
                return;
            }

            // Tøm listen før den bygges opp på nytt
            utvalg.innerHTML = "";

            songNames.forEach((song, index) => {
                // Opprett en rad for sangen
                const row = document.createElement("div");
                row.className = "SangRad";

                // Opprett sangnavnet
                const title = document.createElement("span");
                title.className = "line";
                title.textContent = song;

                // Opprett avspillingsknappen
                const button = document.createElement("button");
                button.type = "button";
                button.className = "PlayThisSongButton";
                button.textContent = "Spill";
                button.title = `Spill ${song}`;
                button.addEventListener("click", () => {
                    playThis(index);
                });

                // Sett sammen raden
                row.appendChild(title);
                row.appendChild(button);

                // Legg raden til på nettsiden
                utvalg.appendChild(row);
            });
        }
      displaySongs("Sangutvalg");

      let currentSong = Math.floor(Math.random() * playlist.length); //Starter med en random sang, med mindre du velger. Se også kommentaren til windows.onload funksjonen.

      async function playCurrentSong() {
          audioSource.src = playlist[currentSong];
          audio.load();

          try {
              await audio.play();
          } catch (error) {
              if (error.name !== "AbortError") {
                  console.error("Kunne ikke spille av sangen:", error);
              }
          }
      }

      function playAudio() {
      if (audio.paused) {
          audio.play();
      }
      }

      function pauseAudio() {
          audio.pause();
      }

      function updateStatus() {
          console.log("Audio status updated: " + (audio.paused ? "paused" : "playing"));
          if (audio.paused) {
              document.getElementById("toggleplayButton").src = "/Bilder/NoSound.svg"; // Set pause button icon
          } else {
              document.getElementById("toggleplayButton").src = "/Bilder/PlayingSong.svg"; // Set play button icon
              console.log("Playing song: " + playlist[currentSong]);
          }
      }

      // Spill neste sang automatisk
      audio.onended = function () {
          currentSong = (currentSong + 1) % playlist.length; // looper tilbake
          console.log("Prøver å spille neste sang")
          playThis(currentSong)
          //playCurrentSong();
      };

        // Toggle play/pause for the audio element when the image is clicked
      function togglePlay() {
          // Hvis audio er på, så pause
          if (audio.paused) {
              playAudio();
              document.getElementById("toggleplayButton").src = "/Bilder/PlayingSong.svg"; // Set play button icon
          } else { // Hvis audio er av, så spill
              pauseAudio();
              document.getElementById("toggleplayButton").src = "/Bilder/NoSound.svg"; // Set pause button icon
          }
      }

      // Bytt til neste sang når knappen klikkes
      function nextSong() {
          currentSong = (currentSong + 1) % playlist.length; // looper tilbake
          playThis(currentSong);
          document.getElementById("toggleplayButton").src = "/Bilder/PlayingSong.svg"; // Set play button icon
      }

      function playThis(song) {
        if (song < 0 || song >= playlist.length) {
            console.error("Ugyldig sangindeks:", song);
            return;
        }
        currentSong = song;
        playCurrentSong();

        //Legg til sangnavn: "Spiller av X" 
        const SangNavn = document.getElementById("SongName");
        if (!SangNavn) {
            console.error("klarte ikke å vise SangNavn");
            return;
        }
        SangNavn.innerText = songNames[song];
      }

      audio.onplay = updateStatus;
      audio.onpause = updateStatus;
      // Auto-start musikk ved lasting av siden
      /*window.onload = function () {
          playCurrentSong();
      };*/ //google elns har oppdatert sin "sikkerhet" som gjør at musikk ikke kan spilles av automatisk



      //PROGRESJONSBAR laget av AI
      const progressBar = document.getElementById("progressBar");
      const currentTimeDisplay = document.getElementById("currentTime");
      const durationDisplay = document.getElementById("duration");

      // Gjør sekunder om til formatet minutter:sekunder
      function formatTime(seconds) {
          if (!Number.isFinite(seconds) || seconds < 0) {
              return "0:00";
          }

          const minutes = Math.floor(seconds / 60);
          const remainingSeconds = Math.floor(seconds % 60);

          return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
      }

      // Oppdater tidsvisningen når sangens metadata er lastet
      audio.addEventListener("loadedmetadata", () => {
          durationDisplay.textContent = formatTime(audio.duration);
      });

      // Oppdater progresjonsbaren mens sangen spiller
      audio.addEventListener("timeupdate", () => {
          if (Number.isFinite(audio.duration) && audio.duration > 0) {
              progressBar.value = (audio.currentTime / audio.duration) * 1000;
              currentTimeDisplay.textContent = formatTime(audio.currentTime);
              durationDisplay.textContent = formatTime(audio.duration);
          }
      });

      // La brukeren hoppe til et annet tidspunkt
      progressBar.addEventListener("input", () => {
          if (Number.isFinite(audio.duration) && audio.duration > 0) {
              const percentage = Number(progressBar.value) / 1000;
              audio.currentTime = percentage * audio.duration;

              currentTimeDisplay.textContent = formatTime(audio.currentTime);
          }
      });
    </script>

    <script>
        window.addEventListener("beforeunload", () => {
        let endTime = Date.now();
        let durationInSeconds = Math.round((endTime - startTime) / 1000);

        gtag('event', 'time_on_page', {
            'event_category': 'engagement',
            'event_label': 'CGP',
            'value': durationInSeconds
        });
        });
  
    </script>
</body>
</html>
