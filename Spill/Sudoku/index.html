<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sudoku</title>
  <style>
  #sudoku-container {
    display: grid;
    grid-template-columns: repeat(9, 40px);
    grid-gap: 2px;
    margin-top: 20px;
  }

  input {
    width: 38px;
    height: 38px;
    text-align: center;
    font-size: 20px;
  }
  </style>
</head>
<body>
  <h1>Sudoku Generator</h1>
  <label for="difficulty">Velg vanskelighetsgrad:</label>
  <select id="difficulty">
    <option value="easy">Lett</option>
    <option value="medium">Middels</option>
    <option value="hard">Vanskelig</option>
    <option value="expert">Ekspert</option>
    <option value="impossible">Gud</option>
  </select>
  <select id="size">
    <option value="nine">9x9</option>
    <option value="sixteen">16x16</option>
    <!--<option value="twentyfive">25x25</option>
    <option value="thirtysix">36x36</option>--> <!-- Script koden er dårlig, den tar faktisk 100 år på å laste inn 25x25 sudoku-->
  </select>
  <button onclick="generateSudoku()">Generer Sudoku</button>
  <div id="sudoku-container"></div>
  <script src="/Javascript/script_Sudoku.js"></script>
</body>
</html>
